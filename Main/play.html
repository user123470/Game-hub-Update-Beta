<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memuat game | Playlume</title>
<meta name="theme-color" content="#080c0b">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Unbounded:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="player-body">

<header class="player-bar">
  <a href="index.html" class="player-btn" id="backBtn" aria-label="Kembali ke daftar game">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>
    <span>Kembali</span>
  </a>

  <h1 class="player-title" id="playerTitle">Memuat...</h1>

  <button type="button" class="player-btn" id="fullscreenBtn" aria-label="Layar penuh">
    <svg id="fsIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square" aria-hidden="true">
      <path d="M8 3H3v5"/>
      <path d="M21 8V3h-5"/>
      <path d="M3 16v5h5"/>
      <path d="M16 21h5v-5"/>
    </svg>
    <span>Layar penuh</span>
  </button>

  <a id="openNewTab" class="player-btn" target="_blank" rel="noopener" aria-label="Buka game di tab baru">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square" aria-hidden="true"><path d="M10 5H4v15h15v-6"/><path d="M14 4h6v6"/><path d="M20 4 11 13"/></svg>
    <span>Tab baru</span>
  </a>
</header>

<main class="player-wrap" id="playerWrap">
  <div id="loading" class="player-loading" role="status">
    <div class="spinner" aria-hidden="true"></div>
    <p>Memuat game</p>
    <small>Kalau belum muncul setelah 6 detik, tombol untuk membukanya di tab baru akan tampil.</small>
  </div>

  <iframe id="gameFrame" class="game-frame hidden" title="Game" width="1280" height="720" allowfullscreen
    allow="autoplay; fullscreen; gamepad; microphone; camera; clipboard-write"></iframe>

  <div id="fallback" class="player-fallback hidden">
    <h2>Game ini tidak bisa dibuka di sini</h2>
    <p>Situs aslinya melarang dijalankan di dalam website lain (proteksi <code>X-Frame-Options</code>).</p>
    <a id="fallbackBtn" class="fallback-btn" target="_blank" rel="noopener">Buka di tab baru</a>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
