<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Hub</title>
<link rel="preconnect" href="https://radiantoptimizer.app">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="gate" class="screen">
  <div class="gate-card">
    <div class="gate-logo">🔒</div>
    <input type="password" id="gatePw" placeholder="Password..." autocomplete="off" autofocus>
    <button id="gateBtn" type="button">ENTER</button>
    <p id="gateErr" class="err"></p>
  </div>
</div>

<div id="authScreen" class="screen hidden">
  <div class="gate-card">
    <div class="gate-logo">👤</div>
    <div class="auth-tabs">
      <button type="button" id="tabLogin" class="active">Masuk</button>
      <button type="button" id="tabReg">Daftar</button>
    </div>
    <input class="auth-in" id="authUser" placeholder="Username" autocomplete="username" maxlength="16" autocapitalize="off" spellcheck="false">
    <input class="auth-in" type="password" id="authPw" placeholder="Password" autocomplete="current-password" maxlength="64">
    <input class="auth-in hidden" type="password" id="authPw2" placeholder="Ulangi password" autocomplete="new-password" maxlength="64">
    <button id="authBtn" type="button">MASUK</button>
    <p id="authErr" class="err"></p>
  </div>
</div>

<div id="adminScreen" class="adm-screen hidden">
<div id="adminScreen" class="adm-screen hidden">
  <div class="adm-win">
    <div class="adm-head">
      <span>ADMIN PANEL</span>
      <span class="adm-head-btns">
        <button type="button" id="admRefresh" title="Refresh">&#8634;</button>
        <button type="button" id="admClose" title="Tutup">X</button>
      </span>
    </div>
    <div class="adm-cols">
      <div class="adm-col">
        <div class="adm-title">PLAYER BAN</div>
        <div class="adm-panel">
          <label>USERNAME</label>
          <div class="adm-userrow">
            <input class="adm-in" id="admUser" placeholder="Username here.." autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="16">
            <button type="button" id="admPick" class="adm-pick" title="Pilih dari daftar player">PILIH</button>
          </div>
          <label>REASON</label>
          <input class="adm-in" id="admReason" placeholder="Reason here.." autocomplete="off" maxlength="200">
          <label>DURATION</label>
          <select class="adm-in" id="admDur">
            <option value="1h">1 Hour</option>
            <option value="3h">3 Hours</option>
            <option value="1d">1 Day</option>
            <option value="3d">3 Days</option>
            <option value="7d">7 Days</option>
            <option value="30d">30 Days</option>
            <option value="perm">Permanent</option>
          </select>
          <button type="button" id="admBan" class="adm-ban">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M2 21h10v-2H2v2zM14.5 2.5l-3 3 1.4 1.4L6 13.8l3 3 6.9-6.9 1.4 1.4 3-3-5.8-5.8zM5 14.5L2.5 17l3 3L8 17.5 5 14.5z"/></svg>
            <span>BAN USER</span>
          </button>
          <button type="button" id="admBanAll" class="adm-ban adm-banall">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 2a8 8 0 0 1 6.3 12.9L7.1 5.7A7.9 7.9 0 0 1 12 4zM5.7 7.1l11.2 11.2A8 8 0 0 1 5.7 7.1z"/></svg>
            <span>BAN ALL</span>
          </button>
          <p id="admMsg" class="adm-msg"></p>
        </div>
      </div>
      <div class="adm-col">
        <div class="adm-title">BANNED PLAYERS</div>
        <div class="adm-panel adm-list-panel">
          <input class="adm-in adm-search" id="admSearch" placeholder="Username..." autocomplete="off" autocapitalize="off">
          <div id="admList" class="adm-list"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Popup daftar semua player -->
  <div id="admPicker" class="adm-picker hidden">
    <div class="adm-picker-win">
      <div class="adm-head">
        <span>PILIH PLAYER <small id="admPickCount"></small></span>
        <span class="adm-head-btns">
          <button type="button" id="admPickClose" title="Tutup">X</button>
        </span>
      </div>
      <input class="adm-in adm-search" id="admPickSearch" placeholder="Cari player..." autocomplete="off" autocapitalize="off">
      <div id="admPickList" class="adm-list adm-picklist"></div>
      <div class="adm-legend">
        <span><i class="adm-dot on"></i> Online</span>
        <span><i class="adm-dot off"></i> Offline</span>
      </div>
    </div>
  </div>
</div>

<div id="verifikasiOverlay" class="verif-overlay hidden">
  <img src="monyet.png" alt="" class="verif-img" onerror="this.src='https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRPo8wVwMZ2UTOrMxH_hvncCBZKDLi3Ojqzt2VunC88Zw&s=10'">
</div>

<div id="app" class="hidden">
  <header class="topbar">
    <div class="brand">
      <span class="brand-icon">⚡</span>
      <span class="brand-name">Game Hub</span>
    </div>
    <div class="search-wrap">
      <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <circle cx="11" cy="11" r="8"></circle>
        <path d="m21 21-4.3-4.3"></path>
      </svg>
      <input type="text" id="search" placeholder="Cari game..." autocomplete="off">
    </div>
    <div class="user-chip">
      <span id="userName"></span>
      <button type="button" id="logoutBtn">Keluar</button>
    </div>
  </header>

  <main>
    <section id="historySection" class="history-section hidden">
      <div class="section-head">
        <h2>Terakhir Dimainkan</h2>
        <button id="clearHistoryBtn" class="text-btn">Hapus riwayat</button>
      </div>
      <div id="historyGrid" class="history-row"></div>
    </section>

    <div class="meta"><span id="count">Memuat...</span></div>
    <div id="chips" class="chips"></div>
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty hidden">
      <div class="empty-icon">🔍</div>
      <p>Tidak ada game yang cocok.</p>
    </div>
  </main>

  <footer><p>Private collection · <span id="totalFoot"></span> game</p></footer>
</div>

<script src="script.js"></script>
</body>
</html>
